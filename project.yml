name: TetherInk
options:
  bundleIdPrefix: ink.tether
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  TetherInk:
    type: application
    platform: iOS
    sources:
      - path: Tether
    info:
      path: Tether/Info.plist
      properties:
        CFBundleDisplayName: Tether Ink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Procreate artwork
            LSHandlerRank: Alternate
            LSItemContentTypes: [ink.tether.procreate]
          - CFBundleTypeName: Brushes
            LSHandlerRank: Alternate
            LSItemContentTypes: [ink.tether.brushset, ink.tether.brush, ink.tether.abr]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: ink.tether.procreate
            UTTypeDescription: Procreate artwork
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [procreate] }
          - UTTypeIdentifier: ink.tether.brushset
            UTTypeDescription: Procreate brush set
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [brushset] }
          - UTTypeIdentifier: ink.tether.brush
            UTTypeDescription: Procreate brush
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [brush] }
          - UTTypeIdentifier: ink.tether.abr
            UTTypeDescription: Photoshop brushes
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: { public.filename-extension: [abr] }
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.tether.app
        PRODUCT_NAME: TetherInk
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
  TetherInkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TetherTests
    dependencies:
      - target: TetherInk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ink.tether.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  TetherInk:
    build:
      targets:
        TetherInk: all
        TetherInkTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TetherInkTests
